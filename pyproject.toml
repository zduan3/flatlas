[project]
name = "flatlas"
version = "0.2.0"
description = "A persistent cross-platform filesystem index and deduplication planner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "blake3>=1.0.0",
    "platformdirs>=4.0.0",
    "tomlkit>=0.15.2",
    "typer>=0.12.0",
]

[project.scripts]
flatlas = "flatlas.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "db: database connections, migrations and concurrent access",
    "scan: metadata scanning, coverage, summaries, cancellation and resume",
    "hash: lazy hashing, duplicate groups and duplicate filters",
    "query: indexed and live queries, scope, ordering and status",
    "plan: immutable dry-run plans and index maintenance interactions",
    "cli: command entry points, arguments and error rendering",
    "output: table formatting, JSON/CSV and export contracts",
    "allocation: platform allocation metadata and zero/unknown semantics",
    "version: package and Git version detection",
    "safety: cross-boundary read-only, deletion and hash validity invariants",
]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
