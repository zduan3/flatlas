[project]
name = "flatlas"
version = "0.1.0"
description = "A persistent cross-platform filesystem index and deduplication planner"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "blake3>=1.0.0",
    "platformdirs>=4.0.0",
    "typer>=0.12.0",
]

[project.scripts]
flatlas = "flatlas.cli:main"

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
target-version = "py312"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
